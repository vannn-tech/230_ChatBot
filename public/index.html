<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Chatbot AI sederhana yang bisa bantu jawab pertanyaan kamu.">
  <title>Chatbot AI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffb703'/%3E%3Ctext x='16' y='22' font-size='16' font-weight='800' text-anchor='middle' font-family='Arial' fill='%2315203a'%3EAI%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat">
    <header class="chat__head" id="head">
      <div class="mark" aria-hidden="true">AI</div>
      <div class="chat__title">
        <h1>Chatbot AI</h1>
        <p>Ling 3.2 Flash lewat OpenRouter</p>
      </div>
      <button type="button" class="ghost" id="new-chat">Chat baru</button>
      <span class="signal" aria-hidden="true"></span>
    </header>

    <section class="chat__log" id="messages" role="log" aria-live="polite" aria-label="Percakapan"></section>

    <form class="composer" id="composer" autocomplete="off">
      <label class="sr-only" for="input">Pesan</label>
      <textarea id="input" rows="1" placeholder="Ketik pesan..." maxlength="4000" aria-describedby="hint status"></textarea>
      <button type="submit" class="send" id="send">Kirim</button>
    </form>
    <p class="sr-only" id="status" role="status" aria-live="polite"></p>
    <p class="hint" id="hint">Enter untuk mengirim, Shift+Enter untuk baris baru.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
